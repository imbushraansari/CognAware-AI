{% extends "base.html" %}

{% block title %}Register | CognAware AI{% endblock %}

{% block content %}
<section class="auth-layout">
	<article class="auth-card">
		<p class="eyebrow">Warm Mind</p>
		<h1>Create your account</h1>
		<p class="auth-subtext">Start tracking thoughts with a calm, supportive workspace.</p>

		<form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
			<div class="form-group">
				<label for="name" class="form-label">Name</label>
				<input type="text" id="name" name="name" class="form-control" required autocomplete="name">
			</div>
			<div class="form-group">
				<label for="email" class="form-label">Email</label>
				<input type="email" id="email" name="email" class="form-control" required autocomplete="email">
			</div>
			<div class="form-group">
				<label for="password" class="form-label">Password</label>
				<input type="password" id="password" name="password" class="form-control" required autocomplete="new-password">
			</div>
			<button type="submit" class="btn btn-primary btn-full">Create Account</button>
		</form>

		<p class="auth-footer">
			Already have an account?
			<a href="{{ url_for('auth.login') }}">Login here</a>
		</p>
	</article>
</section>
{% endblock %}
